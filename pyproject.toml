[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frugal-eis"
version = "0.1.0"
description = "Frequency-budgeted state-of-health estimation of Li-ion cells from impedance spectra"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "joblib", "mrmr_selection"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
